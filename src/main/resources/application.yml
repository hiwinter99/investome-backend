server:
  port: ${PORT:8080}

spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s
      repositories:
        enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/investome}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  jackson:
    time-zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:7200000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:86400000}
  keep-login-refresh-token-expiration-ms: ${JWT_KEEP_LOGIN_REFRESH_TOKEN_EXPIRATION_MS:2592000000}

kis:
  app-key: ${KIS_APP_KEY:}
  app-secret: ${KIS_APP_SECRET:}
  base-url: ${KIS_BASE_URL:https://openapi.koreainvestment.com:9443}
  market-cap-tr-id: ${KIS_MARKET_CAP_TR_ID:FHPST01740000}

fmp:
  api-key: ${FMP_API_KEY:}

turnstile:
  secret-key: ${TURNSTILE_SECRET_KEY:}


investome:
  crypto:
    redis-enabled: ${CRYPTO_REDIS_ENABLED:false}
    cache-key: ${CRYPTO_CACHE_KEY:investome:spring:crypto:top30:v1}
